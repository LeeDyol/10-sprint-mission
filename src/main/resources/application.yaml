# 공통 환경 설정 파일

# 프로젝트 기본 설정
spring:
  application:
    name: discodeit                                       # 프로젝트 고유 이름
  profiles:
    active: dev

# 로깅 설정 값
logging:
  level:
    root: info                                            # 프로젝트 전체에서 로그를 핵심 정보 위주로 출력하도록 설정

# Swagger 설정 값
springdoc:
  api-docs:
    enabled: true                                         # API 명세서 자동 생성 활성화
    path: /api-docs                                       # 생성된 API 명세서의 저장 경로

  swagger-ui:
    enabled: true                                         # 웹 브라우저 내 Swagger UI 활성화
    path: /docs                                           # Swagger UI 접속 주소
    groups-order: DESC                                    # API 그룹 내림차순 정렬
    operations-sorter: method                             # HTTP 메서드 순서대로 API 정렬

  default-consumes-media-type: application/json           # 기본 요청 형식 = JSON
  default-produces-media-type: application/json           # 기본 응답 형식 = JSON