# 배포 환경 관련 설정

server:
  port: ${PORT:8080}                                            # 배포 환경 포트 번호

spring:
  # 데이버테이스 설정
  datasource:
    url: ${DATABASE_URL}                                        # 실제 운영 DB 주소
    username: ${DB_USERNAME}                                    # 운영 DB 접속 계정 아이디
    password: ${DB_PASSWORD}                                    # 운영 DB 접속 비밀번호
    driver-class-name: org.postgresql.Driver                    # PostgreSQL 전용 드라이버 지정

  jpa:
    hibernate:                                                  # 엔티티 - DB 테이블이 일치 여부 확인
      ddl-auto: validate                                        # 엔티티와 DB가 완벽하게 일치할 때만 실행

    show-sql: false                                             # 실행되는 모든 SQL 문을 콘솔에 출력 비활성화

    properties:                                                 # SQL 로그 설정 값
      hibernate:
        format_sql: false                                       # SQL 문을 가독성 좋게 포맷팅
        dialect: org.hibernate.dialect.PostgreSQLDialect        # PostgreSQL 전용 SQL 사용

    open-in-view: false                                         # OVIS 비활성화

# 로깅 설정 값
logging:
  level:
    root: warn                                                  # 잠재적 경로 이상부터 기록
    com.sprint.mission.discodeit: info                          # 프로젝트의 핵심 정보 위주로 출력
  file:
    name: logs/discodeit.log

# 커스텀 설정 값
discodeit:
  storage:                                                      # 로컬 저장소 설정 값
    type: local                                                 # 로컬 서버 저장
    local:
      root-path: ./upload-files                                 # 실제 저장 경로