spring:
  application:
    name: discodeit

  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.hibernate.orm.jdbc.extract: trace

discodeit:
  repository:
    type: jpa           # jcf | file
    file-directory: .discodeit

springdoc:
  api-docs:
    enabled: true
    path: /api-docs             # OpenAPI Spec 추출 경로
  swagger-ui:
    enabled: true
    path: /docs
    groups-order: DESC          # 그룹 정렬 순서
    operations-sorter: method   # GET, POST 순서 정렬
  default-consumes-media-type: application/json
  default-produces-media-type: application/json