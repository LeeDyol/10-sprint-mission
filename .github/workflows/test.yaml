name: CI Test

# 작동 조건 설정
on:
  pull_request:                                 # main 브랜치에 PR이 생성될 때만 작동
    branches: [ "main" ]

# 작업 설정
jobs:
  test:
    runs-on: ubuntu-latest                      # 작동할 운영체제 환경

    steps:
      - name: 1. 소스 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. 자바(JDK 17) 설치
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: 3. Gradle 캐싱
        uses: gradle/actions/setup-gradle@v3

      - name: 4. Gradle 테스트 실행!
        run: ./gradlew test

      - name: 5. Codecov에 테스트 결과 업로드
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}