# 배포 환경 관련 설정

server:
  port: ${PORT:8080}                                            # 배포 환경 포트 번호

spring:
  application:
    name: discodeit
  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_CLIENT_URL}
  # 데이버테이스 설정
  datasource:
    url: ${SPRING_DATASOURCE_URL}                               # 실제 운영 DB 주소
    username: ${POSTGRES_USER}                                  # 운영 DB 접속 계정 아이디
    password: ${POSTGRES_PASSWORD}                              # 운영 DB 접속 비밀번호
    driver-class-name: org.postgresql.Driver                    # PostgreSQL 전용 드라이버 지정

  jpa:
    hibernate:                                                  # 엔티티 - DB 테이블이 일치 여부 확인
      ddl-auto: none                                            # DB 테이블 구조 변경 방지

    show-sql: false                                             # 실행되는 모든 SQL 문을 콘솔에 출력 비활성화

    properties:                                                 # SQL 로그 설정 값
      hibernate:
        format_sql: false                                       # SQL 문을 가독성 좋게 포맷팅
        dialect: org.hibernate.dialect.PostgreSQLDialect        # PostgreSQL 전용 SQL 사용

    open-in-view: false                                         # OVIS 비활성화

  sql:                                                          # 애플리케이션 실행 시, schema.sql 실행 방지
    init:
      mode: never

